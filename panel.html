<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Portal EVL · base de datos</title>
<style>
:root{--bg:#f4f8fa;--bg2:#e8f0ed;--fg:#021b30;--mute:#4a5b66;--line:#d1e0d8;--card:#fff;--acc:#032c4d;--btn:#1a5c44;--btn-h:#0b3d2e;--ok:#0f7a5c;--warn:#8a6a2a;--bad:#b3261e;--body:'Segoe UI',system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#06151f;--bg2:#0a2230;--fg:#eaf3f0;--mute:#9fb8b0;--line:#1c4046;--card:#0d2b33;--acc:#7fc3a5;--btn:#2e7d5b;--btn-h:#3f9c76;--ok:#3fd1a1;--warn:#c9a56b;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
header{background:linear-gradient(120deg,#021b30,#032c4d 60%,#1a5c44);color:#fff;padding:14px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;min-width:180px}
header a,header button{color:#fff;font:600 13px var(--body);background:rgba(255,255,255,.16);border:0;border-radius:999px;padding:8px 14px;text-decoration:none;cursor:pointer}
header button.on{background:#fff;color:#021b30}
main{max-width:1180px;margin:0 auto;padding:16px 16px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.login{max-width:420px;margin:48px auto}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input,select,textarea{width:100%;font:15px var(--body);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input[type=checkbox],input[type=radio]{width:auto}
.btn{font:700 14px var(--body);background:var(--btn);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.btn:hover{background:var(--btn-h)}.btn.sm{padding:6px 11px;font-size:12.5px}.btn.alt{background:var(--acc)}.btn.ghost{background:var(--bg2);color:var(--fg);border:1.5px solid var(--line)}.btn:disabled{opacity:.5;cursor:default}
a.btn{text-decoration:none;display:inline-block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.tabs button{font:600 13.5px var(--body);background:var(--bg2);color:var(--fg);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg2);border-radius:14px;padding:14px}.kpi b{display:block;font-size:26px}.kpi span{color:var(--mute);font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
small{display:block;color:var(--mute)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--bg2)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.msg{padding:10px 14px;border-radius:12px;margin:10px 0;background:var(--bg2);word-break:break-word}.msg.err{color:var(--bad)}.msg.okm{color:var(--ok)}
.empty{color:var(--mute)}
h2{margin:0 0 6px;font-size:18px}h3{margin:16px 0 6px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}.row input,.row select{width:auto;min-width:110px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mail{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--bg)}
.mail b{display:block}
.player{background:#021b30;color:#fff;border-radius:12px;padding:18px;margin:8px 0}
.cd{font:700 20px var(--body)}
a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>Portal de EVL · base de datos (versión de pruebas)</h1>
  <span id="roles"></span>
  <a href="index.html">← Sitio</a>
  <button id="out" hidden>Cerrar sesión</button>
</header>
<main id="app"></main>
<script>
(function(){
var SB='https://yyezqfphedaqaqffhmfe.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5ZXpxZnBoZWRhcWFxZmZobWZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MjAzNzIsImV4cCI6MjEwODA5NjM3Mn0.24hnLtCSx9Uc9erDW03yAZjS41UcY_cN3n-IaKqV8_0';
var TOKEN=null,UID=null,ROLES=[],ROLE=null,TAB=null,COHORT='',SESSION='';
var app=document.getElementById('app');
var LAST={};            /* resultados de las vistas para los manejadores */
var TIMERS=[];
/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function linkify(s){return esc(s).replace(/(https:\/\/[^\s<]+)/g,'<a href="$1">$1</a>')}
function hdr(extra){var h={apikey:KEY,Authorization:'Bearer '+(TOKEN||KEY),'Content-Type':'application/json'};for(var k in extra||{})h[k]=extra[k];return h}
function fail(r,j){if(r.status===401){logout('La sesión venció. Ingrese de nuevo.');throw new Error('Sesión vencida')}throw new Error(mapErr((j&&(j.message||j.hint||j.error_description))||('HTTP '+r.status)))}
var ERR={not_authorized:'No tiene permiso para esta acción.',cycle_not_over:'El ciclo en vivo aún no termina.',nothing_to_recover:'No hay clases pendientes de recuperar.',recording_missing:'Falta marcar la grabación de alguna clase pendiente.',enrollment_not_paid:'La inscripción no está pagada.',pending_recovery:'Tiene una clase por recuperar.',evaluation_not_passed:'Falta la evaluación aprobada.',certificate_exists:'Ya tiene certificado.',course_has_no_certificate:'El curso no emite certificado.',link_invalid:'Enlace no válido.',link_expired:'El enlace venció (pasaron 24 horas).',link_bound_to_other_device:'Este enlace ya se abrió en otro dispositivo.',link_not_opened_in_time:'El enlace no se abrió dentro del plazo de 14 días.',invalid_session:'Esa clase no es válida o aún no ocurre.',enrollment_not_active:'La inscripción no está activa.',code_required:'Escriba un código para el cohort.',invalid_capacity:'La capacidad debe ser mayor que 0.',invalid_base_url:'Dirección base no válida.'};
function mapErr(m){var k=String(m).trim();return ERR[k]||k}
function req(method,path,body,extra){return fetch(SB+path,{method:method,headers:hdr(extra),body:body===undefined?undefined:JSON.stringify(body)}).then(function(r){return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null}catch(e){}if(!r.ok)fail(r,j);return {j:j,r:r}})})}
function get(p,e){return req('GET','/rest/v1/'+p,undefined,e)}
function post(p,b){return req('POST','/rest/v1/'+p,b,{Prefer:'return=representation'}).then(function(x){return x.j})}
function patch(p,b){return req('PATCH','/rest/v1/'+p,b,{Prefer:'return=representation'}).then(function(x){return x.j})}
function upsert(p,b){return req('POST','/rest/v1/'+p,b,{Prefer:'resolution=merge-duplicates,return=representation'}).then(function(x){return x.j})}
function rpc(fn,a){return req('POST','/rest/v1/rpc/'+fn,a||{}).then(function(x){return x.j})}
function count(t,q){return get(t+'?select=id&limit=1'+(q||''),{Prefer:'count=exact'}).then(function(x){var c=x.r.headers.get('content-range')||'';return +(c.split('/')[1]||0)})}
function money(c){return '$'+((c||0)/100).toFixed(2)}
function dt(s){return s?new Date(s).toLocaleString('es-US',{dateStyle:'medium',timeStyle:'short'}):''}
function dtp(s){return s?new Date(s).toLocaleString('es-US',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Los_Angeles'})+' PT':''}
function d0(s){return s?new Date(s+'T12:00:00').toLocaleDateString('es-US',{dateStyle:'medium'}):''}
function by(a,k){var o={};(a||[]).forEach(function(x){(o[x[k]]=o[x[k]]||[]).push(x)});return o}
function pill(k,t){return '<span class="pill '+k+'">'+esc(t)+'</span>'}
var STX={paid:['ok','Pagado'],reserved:['warn','Reservado'],completed:['ok','Completado'],expired:['bad','Vencido'],cancelled:['bad','Cancelado'],pending:['warn','Pendiente'],queued:['warn','En cola'],sent:['ok','Enviado'],skipped:['bad','Omitido'],failed:['bad','Fallido'],lead:['','Prospecto'],active:['ok','Activo'],open:['ok','Abierto'],closed:['','Cerrado'],draft:['warn','Borrador'],in_progress:['warn','En curso'],reported:['warn','Reportada'],link_issued:['warn','Enlace enviado'],passed:['ok','Aprobada'],failed_eval:['bad','No aprobada'],present:['ok','Presente'],absent:['bad','Ausente'],excused:['warn','Justificada'],recovered:['ok','Recuperada'],new:['warn','Nueva'],contacted:['','Contactada'],scheduled:['','Agendada'],registered:['ok','Registrado']};
function stp(s,ev){var m=STX[(ev&&s==='failed')?'failed_eval':s]||['',s];return pill(m[0],m[1])}
function tbl(head,rows){return '<div class="card tw"><table><thead><tr>'+head.map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+head.length+'" class="empty">Sin registros.</td></tr>')+'</tbody></table></div>'}
function uid2(){try{var k=localStorage.getItem('evl_dev');if(!k){k='dev-'+Math.random().toString(36).slice(2,10);localStorage.setItem('evl_dev',k)}return k}catch(e){return 'dev-sesion'}}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}}
function flash(t,err){var b=document.getElementById('msgbox');if(b)b.innerHTML='<div class="msg'+(err?' err':' okm')+'">'+esc(t)+'</div>';window.scrollTo({top:0,behavior:'smooth'})}
function clearTimers(){TIMERS.forEach(clearInterval);TIMERS=[]}
function fmtCd(ms){ms=Math.max(0,ms);var h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);return (h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s}

/* ---------- sesión ---------- */
function loginView(err){
 clearTimers();document.getElementById('out').hidden=true;document.getElementById('roles').innerHTML='';
 app.innerHTML='<div class="card login"><h2>Ingresar</h2><p class="empty">Use el usuario que se creó en Supabase Authentication (administrador, profesor o estudiante de prueba).</p>'+(err?'<div class="msg err">'+esc(err)+'</div>':'')+'<form id="lf"><label for="em">Correo</label><input id="em" type="email" autocomplete="username" required><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required><p><button class="btn" type="submit">Ingresar</button></p></form></div>';
 document.getElementById('lf').onsubmit=function(ev){ev.preventDefault();
  fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value})})
  .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error_description||j.msg||'No se pudo ingresar');TOKEN=j.access_token;UID=j.user&&j.user.id;ss('evl_tok',TOKEN);ss('evl_uid',UID);start()})})
  .catch(function(e){loginView(e.message==='Invalid login credentials'?'Correo o contraseña incorrectos.':e.message)})};
}
function logout(m){TOKEN=null;UID=null;ROLE=null;TAB=null;ss('evl_tok',null);ss('evl_uid',null);loginView(typeof m==='string'?m:undefined)}
document.getElementById('out').onclick=function(){logout()};

var PORTALS={admin:'Administrador',professor:'Profesor',student:'Estudiante'};
var TABSBY={
 admin:[['res','Resumen'],['coh','Cohorts'],['crs','Cursos'],['enr','Inscripciones'],['pay','Pagos'],['rec','Recuperaciones'],['con','Contactos'],['req','Solicitudes'],['msg','Mensajes'],['lat','Latina'],['cer','Certificados']],
 professor:[['coh','Mis cohorts'],['avi','Avisos']],
 student:[['cur','Mis cursos'],['cer','Mis certificados'],['bnd','Mi bandeja']]
};
function start(){
 get('user_roles?select=role&user_id=eq.'+UID).then(function(x){
  var r=x.j.map(function(q){return q.role});ROLES=[];
  if(r.indexOf('admin')>-1||r.indexOf('staff')>-1)ROLES.push('admin');
  if(r.indexOf('professor')>-1||ROLES.indexOf('admin')>-1)ROLES.push('professor'); /* el administrador también puede abrir la vista de profesor */
  if(r.indexOf('student')>-1)ROLES.push('student');
  if(!ROLES.length){loginView('Este usuario no tiene ningún rol asignado.');return}
  document.getElementById('out').hidden=false;
  var pr=ss('evl_r');var want=ss('evl_role');
  ROLE=(pr&&ROLES.indexOf('student')>-1)?'student':(want&&ROLES.indexOf(want)>-1?want:ROLES[0]);
  setRole(ROLE)
 }).catch(function(e){loginView(e.message)});
}
function setRole(r){
 ROLE=r;ss('evl_role',r);TAB=TABSBY[r][0][0];COHORT='';SESSION='';
 document.getElementById('roles').innerHTML=ROLES.length>1?ROLES.map(function(x){return '<button data-role="'+x+'"'+(x===r?' class="on"':'')+'>'+PORTALS[x]+'</button>'}).join(' '):'<span style="font-weight:700;font-size:13px">'+PORTALS[r]+'</span>';
 app.innerHTML='<div class="tabs" id="tabs">'+TABSBY[r].map(function(t){return '<button data-t="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div><div id="msgbox"></div><div id="view"></div>';
 show();
}
document.getElementById('roles').onclick=function(e){var b=e.target.closest('button[data-role]');if(b)setRole(b.getAttribute('data-role'))};
app.addEventListener('click',function(e){var b=e.target.closest('#tabs button');if(b){TAB=b.getAttribute('data-t');show()}});
function show(){
 clearTimers();
 Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('on',b.getAttribute('data-t')===TAB)});
 var v=document.getElementById('view');v.innerHTML='<p class="empty">Cargando…</p>';
 var f=(VIEWS[ROLE]||{})[TAB];if(!f){v.innerHTML='';return}
 f(v).catch(function(e){v.innerHTML='<div class="msg err">'+esc(e.message)+'</div>'})}
function run(btn,p,okMsg,after){if(btn)btn.disabled=true;p.then(function(r){if(okMsg)flash(typeof okMsg==='function'?okMsg(r):okMsg);(after||show)(r)}).catch(function(e){flash(e.message,1);if(btn)btn.disabled=false})}

/* ---------- vistas ---------- */
var VIEWS={admin:{},professor:{},student:{}};

/* ===== ESTUDIANTE ===== */
VIEWS.student.cur=function(v){
 return Promise.all([
  get('enrollments?select=id,status,amount_cents,payment_due_at,cohort_id,cohorts(code,start_date,live_cycle_ended_at,courses(name_es,class_count,certificate_type),cohort_sessions(id,session_no,starts_at,ends_at,recording_path))&order=created_at'),
  get('attendance?select=enrollment_id,session_id,status'),
  get('recovery_requests?select=id,enrollment_id,session_id,status,reported_at'),
  get('evaluations?select=enrollment_id,kind,score,result'),
  get('certificates?select=enrollment_id,certificate_no,verification_code,issued_on,revoked_at'),
  get('zoom_registrations?select=enrollment_id,join_url'),
  get('recovery_tokens?select=enrollment_id,first_opened_at,expires_at,revoked_at,open_by,issued_at&order=issued_at.desc')
 ]).then(function(a){
  var enr=a[0].j,att=by(a[1].j,'enrollment_id'),rr=by(a[2].j,'enrollment_id'),ev=by(a[3].j,'enrollment_id'),ce=by(a[4].j,'enrollment_id'),zo=by(a[5].j,'enrollment_id'),tk=by(a[6].j,'enrollment_id');
  var pend=ss('evl_r');
  var h='<div class="card"><h2>Mis cursos</h2><p class="empty">Aquí ve su inscripción, el enlace de Zoom, las clases y la recuperación de clases perdidas.</p></div>';
  if(!enr.length)h+='<div class="card empty">Todavía no tiene inscripciones.</div>';
  enr.forEach(function(e){
   var c=e.cohorts||{},cr=c.courses||{},ses=(c.cohort_sessions||[]).slice().sort(function(x,y){return x.session_no-y.session_no});
   var active=(e.status==='paid'||e.status==='completed'),now=Date.now();
   var cycleOver=!!c.live_cycle_ended_at||(ses.length&&ses.every(function(s){return new Date(s.ends_at).getTime()<now}));
   var A={};(att[e.id]||[]).forEach(function(x){A[x.session_id]=x.status});
   var R={};(rr[e.id]||[]).forEach(function(x){R[x.session_id]=x});
   var evs=ev[e.id]||[],cert=(ce[e.id]||[])[0],zm=(zo[e.id]||[])[0],toks=tk[e.id]||[],lastTok=toks[0];
   var hasIssued=(rr[e.id]||[]).some(function(x){return x.status==='link_issued'}),hasRep=(rr[e.id]||[]).some(function(x){return x.status==='reported'});
   h+='<div class="card"><div class="row"><h2 style="margin:0;flex:1">'+esc(cr.name_es)+'</h2>'+stp(e.status)+'</div><small>Cohort '+esc(c.code)+' · inicia '+d0(c.start_date)+' · '+money(e.amount_cents)+'</small>';
   if(e.status==='reserved')h+='<div class="msg">Pago pendiente'+(e.payment_due_at?' · vence '+dt(e.payment_due_at):'')+'. En esta versión de pruebas el pago lo registra el administrador desde su panel; en la versión final recibirá el enlace de pago de QuickBooks.</div>';
   if(active&&zm&&zm.join_url)h+='<p><a class="btn alt" href="'+esc(zm.join_url)+'" target="_blank" rel="noopener">Entrar a Zoom</a> <small style="display:inline">Use el mismo nombre y correo de su inscripción. El profesor lo admite desde la sala de espera.</small></p>';
   if(active){
    h+='<h3>Clases</h3><div class="tw"><table><thead><tr><th>#</th><th>Fecha</th><th>Estado</th><th>No pude asistir</th></tr></thead><tbody>'+ses.map(function(s){
     var started=new Date(s.starts_at).getTime()<=now,r=R[s.id],st=A[s.id];
     var cell;
     if(r)cell=stp(r.status);
     else if(st==='present'||st==='recovered')cell='—';
     else if(started)cell='<input type="checkbox" data-miss="'+e.id+'" value="'+s.id+'" aria-label="Clase '+s.session_no+' perdida">';
     else cell='<span class="empty">Aún no ocurre</span>';
     return '<tr><td>'+s.session_no+'</td><td>'+dtp(s.starts_at)+'</td><td>'+(st?stp(st):(started?'<span class="empty">Sin registro</span>':'<span class="empty">Programada</span>'))+'</td><td>'+cell+'</td></tr>'}).join('')+'</tbody></table></div>';
    h+='<p><button class="btn" data-act="miss" data-id="'+e.id+'">Guardar y avisar al profesor</button></p>';
    if(hasRep||hasIssued){
     h+='<h3>Recuperación de clases</h3>';
     if(!cycleOver)h+='<div class="msg">La clase grabada se recupera <b>únicamente después de terminar el ciclo de clases en vivo</b>. Su profesor le enviará un enlace personal cuando eso ocurra.</div>';
     else if(!hasIssued)h+='<div class="msg">El ciclo en vivo terminó. Su profesor le enviará el enlace personal (también llegará a su bandeja).</div>';
     else{
      var saved=ls('evl_tok_'+e.id)||(pend||'');
      var expired=lastTok&&lastTok.expires_at&&new Date(lastTok.expires_at).getTime()<now;
      h+='<div class="msg">Su enlace es personal y de <b>un solo dispositivo</b>. Al abrirlo tendrá <b>24 horas</b> para ver las clases.'+(expired?' <b>El último enlace venció; pida uno nuevo a su profesor.</b>':'')+'</div>';
      h+='<div class="row"><input id="tok_'+e.id+'" placeholder="Pegue aquí su código o enlace" value="'+esc(saved)+'" style="min-width:260px"><button class="btn alt" data-act="redeem" data-id="'+e.id+'">Abrir enlace</button></div><div id="rv_'+e.id+'"></div>';
     }
    }
    if(evs.length)h+='<h3>Evaluación</h3><p>'+evs.map(function(x){return (x.kind==='recovery'?'Recuperación':'Final')+': '+(x.score!=null?x.score+' · ':'')+stp(x.result,1)}).join(' &nbsp; ')+'</p>';
    if(cert&&!cert.revoked_at)h+='<div class="msg okm"><b>Certificado '+esc(cert.certificate_no)+'</b> emitido el '+d0(cert.issued_on)+'. Lo encuentra en <i>Mis certificados</i>.</div>';
    else if(cr.certificate_type!=='none')h+='<p class="empty">Su certificado se emite cuando el profesor confirma su asistencia y aprobación.</p>';
   }
   h+='</div>';
  });
  v.innerHTML=h;
  var auto=ss('evl_r');if(auto){var f=v.querySelector('[data-act=redeem]');if(f)flash('Se cargó su enlace de recuperación. Pulse “Abrir enlace” para comenzar las 24 horas.')}
 })};
function tokOf(s){s=String(s||'').trim();var m=s.match(/[?&]r=([A-Za-z0-9]+)/);return m?m[1]:s}

function cohortDetail(v,rows,mode){
 if(!rows.length){v.innerHTML='<div class="card empty">No tiene cohorts asignados.</div>';return Promise.resolve()}
 if(!COHORT||!rows.some(function(c){return c.id===COHORT}))COHORT=rows[0].id;
 var co=rows.filter(function(c){return c.id===COHORT})[0];
 return Promise.all([
  get('cohort_sessions?select=id,session_no,starts_at,ends_at,recording_path&cohort_id=eq.'+COHORT+'&order=session_no'),
  get('v_professor_roster?select=*&cohort_id=eq.'+COHORT+'&order=full_name'),

 ]).then(function(a){
  var ses=a[0].j,ros=a[1].j,pr=a[2].j;
  if(!SESSION||!ses.some(function(s){return s.id===SESSION}))SESSION=(ses[0]||{}).id||'';
  var eids=ros.map(function(r){return r.enrollment_id});
  var idl=eids.length?'in.('+eids.join(',')+')':'in.(00000000-0000-0000-0000-000000000000)';
  return Promise.all([get('evaluations?select=enrollment_id,kind,score,result&enrollment_id='+idl),get('certificates?select=enrollment_id,certificate_no&enrollment_id='+idl),get('attendance?select=enrollment_id,status&session_id=eq.'+(SESSION||'00000000-0000-0000-0000-000000000000'))]).then(function(b){
   var ev=by(b[0].j,'enrollment_id'),ce=by(b[1].j,'enrollment_id'),at={};b[2].j.forEach(function(x){at[x.enrollment_id]=x.status});
   var ended=!!co.live_cycle_ended_at||(ses.length&&ses.every(function(s){return new Date(s.ends_at).getTime()<Date.now()}));
   var h='<div class="card">'+cohortPicker(rows,COHORT)+'<div class="row" style="margin-top:10px"><b>'+esc(co.courses&&co.courses.name_es)+'</b>'+stp(co.status)+(ended?pill('ok','Ciclo en vivo terminado'):pill('warn','Ciclo en vivo en curso'))+(ended?'':'<button class="btn sm" data-act="endcycle" data-id="'+co.id+'">Terminar ciclo en vivo</button>')+'</div><small>Las grabaciones solo se entregan a los alumnos después de que termina el ciclo.</small></div>';
   h+='<div id="linkbox"></div>';
   h+='<h3>Clases y grabaciones</h3>'+tbl(['#','Fecha','Grabación','Acción'],ses.map(function(s){return '<tr><td>'+s.session_no+'</td><td>'+dtp(s.starts_at)+'</td><td>'+(s.recording_path?pill('ok','Disponible')+'<small>'+esc(s.recording_path)+'</small>':pill('warn','Sin grabación'))+'</td><td>'+(s.recording_path?'<button class="btn sm ghost" data-act="unrec" data-id="'+s.id+'">Quitar</button>':'<button class="btn sm alt" data-act="rec" data-id="'+s.id+'" data-no="'+s.session_no+'" data-code="'+esc(co.code)+'">Marcar grabación disponible</button>')+'</td></tr>'}));
   h+='<h3>Asistencia</h3><div class="card"><div class="row"><label for="sesel" style="margin:0">Clase</label><select id="sesel">'+ses.map(function(s){return '<option value="'+s.id+'"'+(s.id===SESSION?' selected':'')+'>Clase '+s.session_no+' · '+dtp(s.starts_at)+'</option>'}).join('')+'</select></div></div>';

    var acts='';
    if(r.payment_confirmed&&!c){acts+='<div class="row"><select id="k_'+r.enrollment_id+'" aria-label="Tipo"><option value="final">Final</option><option value="recovery">Recuperación</option></select><input id="n_'+r.enrollment_id+'" type="number" min="0" max="100" placeholder="Nota" style="width:80px"><button class="btn sm alt" data-act="eval" data-id="'+r.enrollment_id+'">Evaluar</button></div>';
     if(+r.pending_recoveries>0)acts+='<button class="btn sm" style="margin-top:6px" data-act="sendlink" data-id="'+r.enrollment_id+'">Enviar enlace de recuperación</button> ';
     acts+='<button class="btn sm ghost" style="margin-top:6px" data-act="cert" data-id="'+r.enrollment_id+'">Emitir certificado</button>'}
    return '<tr><td><b>'+esc(r.full_name)+'</b><small>'+esc(r.email)+'</small></td><td>'+stp(r.enrollment_status)+'<small>Zoom: '+esc(r.zoom_status||'—')+'</small></td><td>'+r.absences+'</td><td>'+r.pending_recoveries+'</td><td>'+(e.length?e.map(function(x){return (x.kind==='recovery'?'Recup.':'Final')+' '+(x.score!=null?x.score:'')+' '+stp(x.result,1)}).join('<br>'):'—')+'</td><td>'+(c?'<b>'+esc(c.certificate_no)+'</b>':'—')+'</td><td>'+acts+'</td></tr>'}));
   if(mode!=='nopend')h+='<h3>Recuperaciones pendientes</h3>'+tbl(['Alumno','Clase','Estado','Reportada','¿Puede enviarse?'],pr.map(function(p){return '<tr><td>'+esc(p.full_name)+'</td><td>'+p.session_no+'</td><td>'+stp(p.status)+'</td><td>'+dt(p.reported_at)+'</td><td>'+(p.can_issue_link?(p.recording_ready?pill('ok','Sí'):pill('warn','Falta la grabación')):pill('warn','Hasta que termine el ciclo'))+'</td></tr>'}));
   v.innerHTML=h;
   document.getElementById('cohsel').onchange=function(){COHORT=this.value;SESSION='';show()};
   document.getElementById('sesel').onchange=function(){SESSION=this.value;show()};
  })})}

 v.innerHTML='<div class="card"><h2>Certificados</h2><p class="empty">Pruebe el número en “Verificar” del sitio público. Un certificado revocado se muestra como inválido.</p></div>'+tbl(['Número','Titular','Curso','Emitido','Estado'],x.j.map(function(c){var e=c.enrollments||{};return '<tr><td><b>'+esc(c.certificate_no)+'</b></td><td>'+esc(e.contacts&&e.contacts.full_name)+'</td><td>'+esc(e.cohorts&&e.cohorts.courses&&e.cohorts.courses.name_es)+'<small>'+esc(e.cohorts&&e.cohorts.code)+'</small></td><td>'+d0(c.issued_on)+'</td><td>'+(c.revoked_at?pill('bad','Revocado')+' <button class="btn sm ghost" data-act="unrevoke" data-id="'+c.id+'">Restablecer</button>':pill('ok','Vigente')+' <button class="btn sm ghost" data-act="revoke" data-id="'+c.id+'">Revocar</button>')+'</td></tr>'}))})};

/* ---------- acciones ---------- */
function baseUrl(){return location.origin+location.pathname}
function showLink(tok){var b=document.getElementById('linkbox');if(!b)return;var u=baseUrl()+'?r='+tok;
 b.innerHTML='<div class="msg okm"><b>Enlace de recuperación emitido.</b> Quedó en la bandeja del alumno (cola de mensajes). Para probarlo, cópielo y ábralo con la sesión del estudiante:<br><code style="word-break:break-all">'+esc(u)+'</code></div>'}
document.getElementById('app').addEventListener('click',function(ev){
 var b=ev.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;var act=b.getAttribute('data-act'),id=b.getAttribute('data-id');
 var val=function(i){var e=document.getElementById(i);return e?e.value.trim():''};
 if(act==='miss'){var ids=Array.prototype.map.call(document.querySelectorAll('input[data-miss="'+id+'"]:checked'),function(x){return x.value});
  if(!ids.length){flash('Marque al menos una clase que no pudo asistir.',1);return}
  run(b,rpc('report_missed_class',{p_enrollment:id,p_sessions:ids,p_reason:null}),function(n){return 'Listo. Avisamos a su profesor y le dejamos un mensaje de confirmación en su bandeja. Clases registradas: '+n+'.'})}
 else if(act==='redeem'){var t=tokOf(val('tok_'+id));if(!t){flash('Pegue su código o enlace.',1);return}
  b.disabled=true;rpc('redeem_recovery_token',{p_token:t,p_fingerprint:uid2()}).then(function(rows){ls('evl_tok_'+id,t);ss('evl_r',null);b.disabled=false;if(!rows||!rows.length){flash('El enlace no tiene clases.',1);return}flash('Enlace abierto: comenzaron las 24 horas.');showRecovery(id,rows)}).catch(function(e){flash(e.message,1);b.disabled=false})}
 else if(act==='endcycle')run(b,rpc('end_live_cycle',{p_cohort:id}),'Ciclo en vivo terminado: ya pueden enviarse los enlaces de recuperación.')
 else if(act==='rec')run(b,rpc('set_session_recording',{p_session:id,p_path:'recordings/'+b.getAttribute('data-code')+'/clase-'+b.getAttribute('data-no')+'.mp4'}),'Grabación marcada como disponible (en la versión final se sube el archivo real).')
 else if(act==='unrec')run(b,rpc('set_session_recording',{p_session:id,p_path:''}),'Grabación retirada.')
 else if(act==='att')run(b,upsert('attendance?on_conflict=session_id,enrollment_id',{session_id:SESSION,enrollment_id:id,status:b.getAttribute('data-s'),source:'professor',marked_by:UID,marked_at:new Date().toISOString()}),'Asistencia registrada.')
 else if(act==='eval'){var n=val('n_'+id);if(n===''||isNaN(+n)){flash('Escriba la nota (0 a 100).',1);return}
  run(b,rpc('record_evaluation',{p_enrollment:id,p_kind:val('k_'+id),p_score:+n,p_notes:null}),function(r){return 'Evaluación registrada: '+(r==='passed'?'aprobada.':'no aprobada.')})}
 else if(act==='cert')run(b,rpc('issue_certificate',{p_enrollment:id}),function(r){return 'Certificado emitido: '+r})
 else if(act==='sendlink')run(b,rpc('send_recovery_link',{p_enrollment:id,p_base_url:baseUrl()}),null,function(tok){flash('Enlace emitido.');show();setTimeout(function(){showLink(tok)},700)})
 else if(act==='pay')run(b,get('invoices?select=id,amount_cents&enrollment_id=eq.'+id+'&status=in.(pending,overdue)&limit=1').then(function(r){var inv=r.j[0];if(!inv)throw new Error('No hay factura pendiente.');return post('payments',{invoice_id:inv.id,amount_cents:inv.amount_cents,method:'card',reference:'Panel de pruebas',paid_at:new Date().toISOString()})}),'Pago registrado: cupo confirmado y mensaje en cola.')
 else if(act==='newcoh'){var d=val('nc_d');if(!d){flash('Elija la fecha de inicio.',1);return}run(b,rpc('create_cohort',{p_course:val('nc_c'),p_code:val('nc_code'),p_start:d,p_capacity:+val('nc_cap')||15,p_status:'open'}),'Cohort creado con sus clases semanales.')}
 else if(act==='savecoh')run(b,patch('cohorts?id=eq.'+id,{capacity:+val('cap_'+id),status:val('st_'+id)}),'Cohort actualizado.')
 else if(act==='savecrs')run(b,patch('courses?id=eq.'+id,{price_cents:Math.round((+val('pr_'+id)||0)*100),is_published:document.getElementById('pb_'+id).checked}),'Curso actualizado.')
 else if(act==='newcrs'){var sl=val('ncr_slug'),es=val('ncr_es');if(!sl||!es){flash('Escriba el slug y el nombre en español.',1);return}run(b,post('courses',{slug:sl,name_es:es,name_en:val('ncr_en')||es,price_cents:Math.round((+val('ncr_p')||0)*100),class_count:+val('ncr_n')||1,is_published:false}),'Curso agregado (queda sin publicar).')}
 else if(act==='handled')run(b,patch('chatbot_unanswered?id=eq.'+id,{handled_at:new Date().toISOString(),handled_by:UID}),'Marcada como atendida.')
 else if(act==='revoke')run(b,patch('certificates?id=eq.'+id,{revoked_at:new Date().toISOString(),revoke_reason:'Revocado desde el panel de pruebas'}),'Certificado revocado.')
 else if(act==='unrevoke')run(b,patch('certificates?id=eq.'+id,{revoked_at:null,revoke_reason:null}),'Certificado restablecido.')
});
document.getElementById('app').addEventListener('change',function(ev){var s=ev.target;
 if(s.getAttribute&&s.getAttribute('data-act')==='reqst'){var id=s.getAttribute('data-id'),old=s.getAttribute('data-old'),nv=s.value;
  patch('service_requests?id=eq.'+id,{status:nv}).then(function(){return post('service_request_events',{request_id:id,event_type:'status_change',from_status:old,to_status:nv,actor:UID})}).then(function(){s.setAttribute('data-old',nv);flash('Estado actualizado.')}).catch(function(e){flash(e.message,1)})}
});

/* ---------- inicio ---------- */
(function(){var m=location.search.match(/[?&]r=([A-Za-z0-9]+)/);if(m){ss('evl_r',m[1]);try{history.replaceState(null,'',location.pathname)}catch(e){}}})();
TOKEN=ss('evl_tok');UID=ss('evl_uid');
if(TOKEN&&UID)start();else loginView();
})();
</script>
